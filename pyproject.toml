[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vyom"
version = "2.0.0"
description = "Vyom - Toward Machine Cognition: an open-source research platform combining a local language model with a recurrent dynamic graph workspace, user-controlled memory and model-based planning."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Vyom contributors"}
]
keywords = ["cognitive-architecture", "large-language-models", "graph-neural-networks", "recurrent-memory", "planning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: Apache Software License",
]
# Lower bounds are the oldest versions we expect to work; the exact versions used for
# the published tests and benchmarks are pinned in requirements.lock.txt.
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "numpy>=1.24,<3",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.5",
    "pillow>=10.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.27",
    "ruff>=0.5",
]
bench = [
    "datasets>=2.18",
]
lora = [
    "peft>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E731"]
per-file-ignores = { "examples/*" = ["E402"], "benchmarks/*" = ["E402"] }
